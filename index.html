<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест Firebase</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #0b1220; color: white; }
        button { padding: 15px; font-size: 18px; margin-top: 20px; width: 100%; background: #4c9aff; color: white; border: none; border-radius: 8px; }
        input { padding: 10px; width: 100%; margin-top: 10px; box-sizing: border-box; }
        #log { margin-top: 20px; color: #24bd88; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Тест связи с облаком</h2>
    <p>Введите любое слово и нажмите кнопку:</p>
    <input type="text" id="testInput" placeholder="Например: Привет">
    <button onclick="testSave()">СОХРАНИТЬ В ОБЛАКО</button>
    <div id="log">Статус: Ожидание...</div>

    <!-- Подключение Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCJm6jPRCfLp7npy5uCRZo3Cq0v_X-M1e4",
          authDomain: "technobase-a6671.firebaseapp.com",
          projectId: "technobase-a6671",
          storageBucket: "technobase-a6671.firebasestorage.app",
          messagingSenderId: "817410176779",
          appId: "1:817410176779:web:1c300a053c94301937140e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function testSave() {
            let val = document.getElementById("testInput").value;
            if(!val) { alert("Введите текст!"); return; }
            
            document.getElementById("log").innerText = "Статус: Отправка...";

            db.collection("test").add({
                text: val,
                date: new Date()
            })
            .then(() => {
                document.getElementById("log").innerText = "Статус: УСПЕШНО СОХРАНЕНО В ОБЛАКО!";
                document.getElementById("testInput").value = "";
            })
            .catch((error) => {
                document.getElementById("log").innerText = "Статус: ОШИБКА! " + error.message;
                document.getElementById("log").style.color = "red";
            });
        }
    </script>
</body>
</html>
